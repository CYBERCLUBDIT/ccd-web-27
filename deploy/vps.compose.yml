services:
  web:
    image: node:22-bookworm-slim@sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
    restart: unless-stopped
    init: true
    user: "1000:1000"
    working_dir: /app
    env_file:
      - ../.env.vps-production
    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /app/.local/supabase-ca.crt
    volumes:
      - ../:/app
    ports:
      - "127.0.0.1:3100:3000"
    command: ["node", "node_modules/next/dist/bin/next", "start", "--hostname", "0.0.0.0", "--port", "3000"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      proxy:
        aliases:
          - cyberclubdit-web

networks:
  proxy:
    external: true
    name: fikaai-production_private
